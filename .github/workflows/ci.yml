name: Offline checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.24'
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            **/pyproject.toml
      - name: Generated configuration defaults
        run: python scripts/config-defaults.py --check
      - name: Native image libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libde265-0 ffmpeg
      - name: Locked test dependencies
        run: uv sync --locked --extra database --extra login --group test --python ${{ matrix.python }}
      - name: Dependency consistency
        run: uv run --locked --no-sync python scripts/dependencies.py --check
      - name: Installed dependencies
        run: uv pip check
      - name: Repository hygiene
        run: uv run --locked --no-sync python scripts/check-repository.py --history
      - name: Offline regression
        run: uv run --locked --no-sync python -X utf8 scripts/test-offline.py
      - name: Whitespace
        run: git diff --check

  app-wheel:
    name: Installed app / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/web/frontend/package-lock.json
      - name: Frontend dependencies
        working-directory: src/web/frontend
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        working-directory: src/web/frontend
        run: npm run build
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.24'
      - name: Build isolated release wheels
        run: python scripts/build-wheels.py --out dist
      - name: Check installed CLI and resources outside the source checkout
        run: python scripts/smoke-app-wheel.py dist/wxbridge-*.whl
