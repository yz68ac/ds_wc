[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wxbridge-web"
version = "0.1.0"
description = "Self-hosted management API for the wxbridge source application"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["httpx>=0.28,<1"]

[tool.setuptools]
packages = ["wxbridge_web"]
package-dir = {"wxbridge_web" = "."}
