[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wxbridge"
dynamic = ["version"]
description = "WeChat bot, instance management and local Web administration"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "model-provider>=0.3.1,<0.4",
  "wechat-linux-adapter>=0.2,<0.3",
  "Pillow>=11,<14",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "packaging>=24,<27",
]

[project.scripts]
wxbridge = "wxbridge.cli:main"

[project.optional-dependencies]
database = ["wechat-linux-adapter[database]"]
analysis = ["wechat-linux-adapter[analysis]"]
login = ["wechat-linux-adapter[login]"]

[dependency-groups]
test = [
  "httpx>=0.28,<1",
  "httpx2>=2,<3",
]

[tool.uv]
required-version = ">=0.11"
default-groups = []

[tool.uv.sources]
model-provider = { path = "src/provider", editable = true }
wechat-linux-adapter = { path = "src/wechat_linux", editable = true }

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = { attr = "wxbridge.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["wxbridge", "wxbridge.*", "wxbridge_service", "wxbridge_service.*", "wxbridge_web", "wxbridge_web.*"]
namespaces = false

[tool.setuptools.data-files]
"share/wxbridge" = ["config.defaults.json"]
"share/wxbridge/prompts" = ["prompts/*.md", "prompts/*.json"]
"share/wxbridge/webui" = ["src/webui/dist/*.html"]
"share/wxbridge/webui/assets" = ["src/webui/dist/assets/*"]
